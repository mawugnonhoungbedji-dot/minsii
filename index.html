  <!-- 
    ✍️ Typographie Minsii — Paire "L'Expert Éditorial"
    - Fraunces : Serif variable optique → Titres. Chaleur, autorité, mémoire éditoriale. 
    - Lexend : Sans-serif → Corps. Conçu pour réduire la charge cognitive sur mobile.
    Inspiré : typography-pairs.md #3 "La Force Tranquille" (adapté contexte éducatif béninois)
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Lexend:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background-color: #FDFAF7;   /* Ivoire — humanise, réduit la fatigue oculaire */
      color: #1A1008;              /* Noir chaud */
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {

      font-optical-sizing: auto;
    }

    .perspective-1000 {
      perspective: 1000px;
    }

    .rotate-y-12 {
      transform: rotateY(12deg);
    }

      z-index: 1;
    }
  </style>

<body>
  <!-- Ambient Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <!-- Scroll Reveal -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => {
        if (el.isIntersecting) {
          el.target.classList.add('visible');
          observer.unobserve(el.target);
        }
      });
    }, { threshold: 0.12 });
    const init = () => document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    window.refreshReveal = init;
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
    // re-run after React mounts
    setTimeout(init, 600);
    setTimeout(init, 1400);
  </script>
</body>
